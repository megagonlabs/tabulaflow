[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tabulaflow"
authors = [{ name = "Megagon Labs" }]
version = "0.1.0"
description = "A data agent and text-to-query toolkit for databases, files, and the web"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["data-agent", "database", "nl2sql", "text-to-query", "text-to-sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiolimiter>=1.2.1",
    "aiosqlite>=0.21.0",
    "arize-phoenix-otel>=0.10.1",
    "asyncmy>=0.2.11",
    "asyncpg>=0.30.0",
    "datasets>=4.4.2",
    "genai-prices>=0.1.4,<0.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langfuse>=3.0.1",
    "pandas>=2.2.3",
    "pyarrow>=21.0.0",
    "pydantic>=2.12",
    "pydantic-ai-slim[anthropic,google,openai]>=2.36.0,<3",
    "pydantic-settings>=2.11.0",
    "pymysql>=1.1.1",
    "snowflake-connector-python>=3.14.1",
    "snowflake-sqlalchemy>=1.7.3",
    "sqlalchemy[asyncio]>=2.0.40",
    "sqlalchemy-bigquery>=1.11.0",
    "sqlglot>=28.6.0",
    "sqlparse>=0.5.3",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "google-cloud-bigquery-storage>=2.36.2",
    "duckdb>=1.5.0",
    "neo4j>=5.28.0",
    "duckdb-engine>=0.17.0",
    "dbt-duckdb>=1.10.1",
    "typer>=0.15.0",
    "rich>=14.0.0",
    "textual[syntax]>=8.2.8",
    "plotext>=5.3.2,<6",
    "playwright>=1.59.0",
    "webbrowser-open>=0.3.0",
    "pyyaml>=6.0.3",
    "pypdf>=6.12.2",
    "pygments>=2.19.2",
    "markdown-it-py>=4.0.0",
    "tiktoken>=0.12.0",
]

[project.scripts]
tabulaflow = "tabulaflow.app.main:main"

[project.urls]
Homepage = "https://www.megagon.ai"
Repository = "https://github.com/megagonlabs/tabulaflow"
Issues = "https://github.com/megagonlabs/tabulaflow/issues"

[tool.setuptools.packages.find]
include = ["tabulaflow*"]

[tool.setuptools.package-data]
tabulaflow = [
    "agents/chat/*.md",
    "app/tui/*.tcss",
    "app/assets/samples/*",
    "app/pane/assets/ui/*",
    "app/pane/assets/ui/render/*",
    "app/pane/assets/vendor/cytoscape/*",
    "app/pane/assets/vendor/katex/*",
    "app/pane/assets/vendor/katex/fonts/*",
    "app/pane/assets/vendor/markdown-it/*",
    "app/pane/assets/vendor/markdown-it-texmath/*",
    "app/pane/assets/vendor/maplibre/*",
    "app/pane/assets/vendor/tabulator/*",
    "app/pane/assets/vendor/vega/*",
]

[tool.ruff]
line-length = 120
include = ["tabulaflow/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.10",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ipython",
    "types-tabulate>=0.9.0",
    "types-pyyaml>=6.0.12.20260518",
    "import-linter>=2.11",
    "matplotlib",
    "pillow>=11.3.0",
]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data/*"]
asyncio_mode = "auto"

# Architecture contract for the layered package (see AGENTS.md "Project Structure").
# Product/platform layers, lowest first: core < data < output < agents < app.
# Research is a separate leaf consumer: it may import core/data/output/agents,
# but neither app nor platform layers may import research, research must not import app,
# and its pipelines remain the outermost research orchestration layer.
# Run: make lint-arch
[tool.importlinter]
root_package = "tabulaflow"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "tabulaflow.app",
    "tabulaflow.agents",
    "tabulaflow.output",
    "tabulaflow.data",
    "tabulaflow.core",
]

[[tool.importlinter.contracts]]
name = "Platform and app do not import research"
type = "forbidden"
source_modules = [
    "tabulaflow.core",
    "tabulaflow.data",
    "tabulaflow.output",
    "tabulaflow.agents",
    "tabulaflow.app",
]
forbidden_modules = ["tabulaflow.research"]

[[tool.importlinter.contracts]]
name = "Research does not import app"
type = "forbidden"
source_modules = ["tabulaflow.research"]
forbidden_modules = ["tabulaflow.app"]

[[tool.importlinter.contracts]]
name = "Research internals do not import pipelines"
type = "forbidden"
source_modules = [
    "tabulaflow.research.agents",
    "tabulaflow.research.benchmarks",
    "tabulaflow.research.metrics",
    "tabulaflow.research.preprocessing",
    "tabulaflow.research.tools",
    "tabulaflow.research.ambiguity",
    "tabulaflow.research.query_execution",
    "tabulaflow.research.query_analysis",
    "tabulaflow.research.reporting",
    "tabulaflow.research.observability",
    "tabulaflow.research.types",
]
forbidden_modules = ["tabulaflow.research.pipelines"]

[[tool.importlinter.contracts]]
name = "Browser pane does not import TUI"
type = "forbidden"
source_modules = ["tabulaflow.app.pane"]
forbidden_modules = ["tabulaflow.app.tui"]

[[tool.importlinter.contracts]]
name = "App session does not import presentation surfaces"
type = "forbidden"
source_modules = ["tabulaflow.app.session"]
forbidden_modules = [
    "tabulaflow.app.pane",
    "tabulaflow.app.tui",
]
