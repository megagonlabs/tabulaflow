[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mintq"
authors = [{ name = "Yanlin Feng", email = "yanlinf23@gmail.com" }]
version = "0.1.0"
description = "Minimalist Text to Query Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.21.0",
    "arize-phoenix-otel>=0.10.1",
    "asyncmy>=0.2.10",
    "asyncpg>=0.30.0",
    "func-timeout>=4.3.5",
    "genai-prices>=0.0.29",
    "graphviz>=0.20.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langfuse>=3.0.1",
    "litellm>=1.67.4.post1",
    "logfire>=3.16.0",
    "mcp[cli]>=1.9.4",
    "openinference-instrumentation-litellm>=0.1.21",
    "pandas>=2.2.3",
    "pydantic>=2.11.3",
    "pydantic-ai==1.0.15",
    "pymysql>=1.1.1",
    "snowflake-connector-python>=3.14.1",
    "snowflake-sqlalchemy>=1.7.3",
    "sqlalchemy[asyncio]>=2.0.40",
    "sqlparse>=0.5.3",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
]

[tool.setuptools]
packages = ["mintq"]

[tool.ruff]
line-length = 120
include = ["mintq/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.10",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ipython",
    "types-tabulate>=0.9.0",
    "types-aiofiles>=24.1.0.20250516",
]
streamlit = ["streamlit>=1.50.0"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["scripts/test_readme.py", "scripts/mcp_client.py"]

[tool.pytest.ini_options]
norecursedirs = ["data/*"]
