[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mintq"
authors = [{ name = "Yanlin Feng", email = "yanlinf23@gmail.com" }]
version = "0.1.0"
description = "Minimal Text to Query Toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "func-timeout>=4.3.5",
    "graphviz>=0.20.3",
    "jinja2>=3.1.6",
    "litellm>=1.67.4.post1",
    "logfire>=3.16.0",
    "pandas>=2.2.3",
    "pydantic>=2.11.3",
    "pydantic-ai==0.2.3",
    "pymysql>=1.1.1",
    "snowflake-connector-python>=3.14.1",
    "snowflake-sqlalchemy>=1.7.3",
    "sqlalchemy>=2.0.40",
    "tqdm>=4.67.1",
]

[tool.setuptools]
packages = ["mintq"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "mypy>=1.15.0",
]
