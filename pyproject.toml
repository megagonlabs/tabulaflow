[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabulaflow"
authors = [{ name = "Yanlin Feng", email = "yanlinf23@gmail.com" }]
version = "0.1.0"
description = "Minimalist Text to Query Toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiolimiter>=1.2.1",
    "aiosqlite>=0.21.0",
    "arize-phoenix-otel>=0.10.1",
    "asyncmy>=0.2.11",
    "asyncpg>=0.30.0",
    "datasets>=4.4.2",
    "func-timeout>=4.3.5",
    "genai-prices>=0.0.29",
    "graphviz>=0.20.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langfuse>=3.0.1",
    "litellm>=1.82.0",
    "logfire>=3.16.0",
    "mcp[cli]>=1.9.4",
    "openinference-instrumentation-litellm>=0.1.21",
    "pandas>=2.2.3",
    "pyarrow>=21.0.0",
    "pydantic>=2.11.3",
    "pydantic-ai>=1.79.0",
    "pydantic-settings>=2.11.0",
    "pymysql>=1.1.1",
    "snowflake-connector-python>=3.14.1",
    "snowflake-sqlalchemy>=1.7.3",
    "sqlalchemy[asyncio]>=2.0.40",
    "sqlalchemy-bigquery>=1.11.0",
    "sqlglot>=28.6.0",
    "sqlparse>=0.5.3",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
    "google-cloud-bigquery-storage>=2.36.2",
    "duckdb>=1.5.0",
    "neo4j>=5.28.0",
    "duckdb-engine>=0.17.0",
    "dbt-duckdb>=1.10.1",
    "typer>=0.15.0",
    "rich>=14.0.0",
    "textual[syntax]>=3.0.0",
    "plotext>=5.3.2",
    "pydantic-ai-slim[anthropic]>=1.79.0",
    "playwright>=1.59.0",
    "webbrowser-open>=0.3.0",
    "pyyaml>=6.0.3",
    "pypdf>=6.12.2",
]

[project.optional-dependencies]
plot = ["matplotlib"]

[project.scripts]
tabulaflow = "tabulaflow.app.main:main"

[tool.setuptools.packages.find]
include = ["tabulaflow*"]

[tool.setuptools.package-data]
tabulaflow = ["app/assets/tabulator/*", "app/assets/debug/*", "app/assets/samples/*"]

[tool.ruff]
line-length = 120
include = ["tabulaflow/**/*.py", "tests/**/*.py", "scripts/**/*.py"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.10",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ipython",
    "types-tabulate>=0.9.0",
    "types-aiofiles>=24.1.0.20250516",
    "types-pyyaml>=6.0.12.20260518",
    "import-linter>=2.11",
]
streamlit = ["streamlit>=1.50.0"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["scripts/test_readme.py", "scripts/mcp_client.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data/*"]
asyncio_mode = "auto"

# Architecture contract for the layered package (see AGENTS.md "Project Structure").
# Layers, lowest first: core < datasources < toolhub < modulehub < {chat | research} < app.
# `chat` and `research` are siblings and must not import each other. Run: make lint-arch
[tool.importlinter]
root_package = "tabulaflow"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "tabulaflow.app",
    "tabulaflow.chat | tabulaflow.research",
    "tabulaflow.modulehub",
    "tabulaflow.toolhub",
    "tabulaflow.datasources",
    "tabulaflow.core",
]
