name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --all-packages --group dev
      - run: make lint
      - run: make mypy
      - run: make lint-arch

  linux-tests:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras --all-packages --group dev
      - run: uv run playwright install --with-deps chromium
      - run: make test

  macos-tests:
    name: macOS / Python 3.13
    runs-on: macos-14
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-extras --all-packages --group dev
      - run: uv run playwright install --with-deps chromium
      - run: make test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv build --wheel --sdist
      - run: uvx twine check dist/*
      - run: uvx check-wheel-contents dist/*.whl
      - name: Smoke-test installed wheel
        run: |
          wheel="$GITHUB_WORKSPACE/$(find dist -name '*.whl' -print -quit)"
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" "$wheel"
          cd "$RUNNER_TEMP"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_installed_package.py"
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/smoke/bin/tabulaflow" --help >/dev/null
          HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/smoke/bin/tabulaflow" benchmark list >/dev/null
      - name: Smoke-test uv tool installation
        run: |
          wheel="$GITHUB_WORKSPACE/$(find dist -name '*.whl' -print -quit)"
          export UV_TOOL_DIR="$RUNNER_TEMP/tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/tool-bin"
          uv tool install "$wheel"
          HOME="$RUNNER_TEMP/home" "$UV_TOOL_BIN_DIR/tabulaflow" --help >/dev/null
          HOME="$RUNNER_TEMP/home" "$UV_TOOL_BIN_DIR/tabulaflow" benchmark list >/dev/null
