<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">How TabulaFlow turns a data connection into an artifact</title>
  <desc id="description">A user or agent connects a SQLite database to the data connector registry. TabulaFlow executes a query to create a result table, then attaches a visualization specification to create an artifact such as a chart, map, or graph.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/>
    </marker>
    <style>
      .block { fill: #1a212c; stroke: #303846; stroke-width: 1.5; }
      .block-label { fill: #6a737d; font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .title { fill: #e4e4e7; font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #9aa4b2; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #e0e0e0; font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .action { fill: #e4e4e7; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .actor { fill: #6a737d; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #9aa4b2; stroke-width: 2; marker-end: url(#arrow); }
      .table-line { stroke: #303846; stroke-width: 1; }
      .chart-bar { fill: #3eb489; }
    </style>
  </defs>

  <path d="M 38 181 L 150 181" class="arrow"/>
  <text x="93" y="153" class="action">Connect</text>
  <text x="93" y="210" class="actor">User or agent</text>

  <rect x="150" y="80" width="280" height="202" rx="9" class="block"/>
  <text x="174" y="111" class="block-label">DATA CONNECTOR REGISTRY</text>
  <text x="174" y="151" class="title">SQLite database</text>
  <text x="174" y="183" class="mono">alias: analytics</text>
  <text x="174" y="217" class="body">Schema available to the agent</text>

  <path d="M 430 181 L 610 181" class="arrow"/>
  <text x="520" y="153" class="action">Execute query</text>
  <text x="520" y="210" class="actor">SQL</text>

  <rect x="610" y="80" width="240" height="202" rx="9" class="block"/>
  <text x="634" y="111" class="block-label">RESULT TABLE</text>
  <text x="634" y="147" class="mono">merchant</text>
  <text x="770" y="147" class="mono">total</text>
  <line x1="634" y1="160" x2="826" y2="160" class="table-line"/>
  <text x="634" y="188" class="body">Acme Market</text>
  <text x="770" y="188" class="body">$1,240</text>
  <line x1="634" y1="201" x2="826" y2="201" class="table-line"/>
  <text x="634" y="229" class="body">City Cafe</text>
  <text x="770" y="229" class="body">$860</text>
  <line x1="752" y1="125" x2="752" y2="251" class="table-line"/>

  <path d="M 850 181 L 1025 181" class="arrow"/>
  <text x="938" y="145" class="action">Attach visualization</text>
  <text x="938" y="163" class="action">specification</text>
  <text x="938" y="210" class="actor">Chart · Map · Graph</text>

  <rect x="1025" y="80" width="145" height="202" rx="9" class="block"/>
  <text x="1049" y="111" class="block-label">ARTIFACT</text>
  <line x1="1051" y1="242" x2="1146" y2="242" class="table-line"/>
  <line x1="1051" y1="140" x2="1051" y2="242" class="table-line"/>
  <rect x="1065" y="198" width="15" height="44" rx="2" class="chart-bar"/>
  <rect x="1091" y="171" width="15" height="71" rx="2" class="chart-bar" opacity="0.82"/>
  <rect x="1117" y="148" width="15" height="94" rx="2" class="chart-bar" opacity="0.64"/>
  <text x="1098" y="264" class="actor">Interactive result</text>
</svg>
