<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title description">
  <title id="title">How TabulaFlow turns a data connection into an artifact</title>
  <desc id="description">The command /connect merchants.sqlite adds a SQLite database to the data connector registry. The run_query tool executes SELECT * FROM merchant_totals to create a result table, then render_chart creates a bar chart artifact using merchant and total.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa4b2"/>
    </marker>
    <style>
      .block { fill: #1a212c; stroke: #303846; stroke-width: 1.5; }
      .block-label { fill: #6a737d; font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1px; }
      .title { fill: #e4e4e7; font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #9aa4b2; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #e0e0e0; font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .example { fill: #e0e0e0; font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .actor { fill: #6a737d; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #9aa4b2; stroke-width: 2; marker-end: url(#arrow); }
      .table-line { stroke: #303846; stroke-width: 1; }
      .chart-bar { fill: #3eb489; }
    </style>
  </defs>

  <g transform="translate(0 40)">
  <text x="385" y="48" class="example">/connect merchants.sqlite</text>
  <path d="M 360 24 L 360 70" class="arrow"/>

  <rect x="210" y="70" width="300" height="140" rx="9" class="block"/>
  <text x="234" y="101" class="block-label">DATA CONNECTOR REGISTRY</text>
  <text x="234" y="139" class="title">merchants.sqlite</text>
  <text x="234" y="168" class="mono">alias: merchants</text>
  <text x="234" y="192" class="body">Schema available to the agent</text>

  <text x="385" y="262" class="example">run_query(SELECT * FROM merchant_totals)</text>
  <path d="M 360 210 L 360 310" class="arrow"/>

  <rect x="230" y="310" width="260" height="160" rx="9" class="block"/>
  <text x="254" y="341" class="block-label">RESULT TABLE</text>
  <text x="254" y="377" class="mono">merchant</text>
  <text x="410" y="377" class="mono">total</text>
  <line x1="254" y1="390" x2="466" y2="390" class="table-line"/>
  <text x="254" y="418" class="body">Acme Market</text>
  <text x="410" y="418" class="body">$1,240</text>
  <line x1="254" y1="431" x2="466" y2="431" class="table-line"/>
  <text x="254" y="459" class="body">City Cafe</text>
  <text x="410" y="459" class="body">$860</text>
  <line x1="392" y1="355" x2="392" y2="459" class="table-line"/>

  <text x="385" y="514" class="example">render_chart(</text>
  <text x="385" y="535" class="example">mark: bar, x: merchant, y: total)</text>
  <path d="M 360 470 L 360 570" class="arrow"/>

  <rect x="280" y="570" width="160" height="130" rx="9" class="block"/>
  <text x="304" y="601" class="block-label">ARTIFACT</text>
  <line x1="307" y1="674" x2="413" y2="674" class="table-line"/>
  <line x1="307" y1="620" x2="307" y2="674" class="table-line"/>
  <rect x="322" y="651" width="17" height="23" rx="2" class="chart-bar"/>
  <rect x="352" y="636" width="17" height="38" rx="2" class="chart-bar" opacity="0.82"/>
  <rect x="382" y="620" width="17" height="54" rx="2" class="chart-bar" opacity="0.64"/>
  <text x="360" y="692" class="actor">Interactive result</text>
  </g>
</svg>
