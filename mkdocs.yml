site_name: TabulaFlow
site_description: An interactive data agent, Python library, and text-to-query research toolkit
site_url: https://megagonlabs.github.io/tabulaflow/
repo_url: https://github.com/megagonlabs/tabulaflow
repo_name: megagonlabs/tabulaflow
copyright: Copyright &copy; Megagon Labs

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  features:
    - navigation.sections
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: custom
    accent: custom

nav:
  - Overview: index.md
  - Installation: installation.md
  - Data Agent:
      - Overview: data-agent/index.md
      - Quick start: data-agent/quick-start.md
      - Connecting data: data-agent/connecting-data.md
      - Common workflows: data-agent/common-workflows.md
      - Configuration: data-agent/configuration.md
  - Python Library:
      - Overview: python-library/index.md
      - Quick start: python-library/quick-start.md
      - API reference: python-library/api-reference.md
  - Research Toolkit:
      - Overview: research-toolkit/index.md
      - Quick start: research-toolkit/quick-start.md
      - Benchmarks and datasets: research-toolkit/benchmarks-and-datasets.md
      - Running experiments: research-toolkit/running-experiments.md
      - Evaluation: research-toolkit/evaluation.md
  - Reference:
      - Security and privacy: reference/security-and-privacy.md
      - Troubleshooting: reference/troubleshooting.md
      - Release notes ↗: https://github.com/megagonlabs/tabulaflow/releases

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
