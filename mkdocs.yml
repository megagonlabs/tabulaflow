site_name: TabulaFlow
site_description: An interactive data agent, Python library, and text-to-query research toolkit
site_url: https://megagonlabs.github.io/tabulaflow/
repo_url: https://github.com/megagonlabs/tabulaflow
repo_name: megagonlabs/tabulaflow
copyright: "&copy; 2026 Megagon Labs"

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/megagon-labs/about/
      name: Megagon Labs on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/megagonlabs
      name: Megagon Labs on X

nav:
  - Overview: index.md
  - Models and providers: models.md
  - TabulaFlow App:
      - Overview: app/index.md
      - Connect data: app/connecting-data.md
      - Configuration: app/configuration.md
  - Python Library:
      - Overview: library/index.md
      - Data connectors: library/data-connectors.md
      - Extraction and enrichment: library/extraction-and-enrichment.md
      - Chat sessions: library/chat-sessions.md
      - Structured outputs: library/structured-outputs.md
      - Custom agents: library/custom-agents.md
      - API reference:
          - Overview: library/api/index.md
          - Core: library/api/core.md
          - Data: library/api/data.md
          - Output: library/api/output.md
          - Agents: library/api/agents.md
  - Research Toolkit:
      - Overview: research/index.md
      - Benchmarks: research/benchmarks.md
      - "ARCS: Ambiguous Text-to-SQL": research/arcs.md
      - Agents: research/agents.md
      - Run experiments: research/running-experiments.md
      - Evaluation and analysis: research/evaluation.md
      - Extend the toolkit: research/extending.md
      - API reference:
          - Overview: research/api/index.md
          - Tasks and runs: research/api/types.md
          - Benchmarks: research/api/benchmarks.md
          - Agents and tools: research/api/agents.md
          - Pipelines: research/api/pipelines.md
          - Preprocessing: research/api/preprocessing.md
          - Metrics: research/api/metrics.md

plugins:
  - search
  - redirects:
      redirect_maps:
        data-agent/configuration.md: app/configuration.md
        data-agent/connecting-data.md: app/connecting-data.md
        python-library/quick-start.md: library/index.md
        python-library/data-connectors.md: library/data-connectors.md
        python-library/extraction-and-enrichment.md: library/extraction-and-enrichment.md
        python-library/chat-sessions.md: library/chat-sessions.md
        python-library/structured-outputs.md: library/structured-outputs.md
        python-library/custom-agents.md: library/custom-agents.md
        python-library/api-reference.md: library/api/index.md
        python-library/api/core.md: library/api/core.md
        python-library/api/data.md: library/api/data.md
        python-library/api/output.md: library/api/output.md
        python-library/api/agents.md: library/api/agents.md
        research-toolkit/quick-start.md: research/index.md
        research-toolkit/benchmarks.md: research/benchmarks.md
        research-toolkit/arcs.md: research/arcs.md
        research-toolkit/agents.md: research/agents.md
        research-toolkit/running-experiments.md: research/running-experiments.md
        research-toolkit/evaluation.md: research/evaluation.md
        research-toolkit/extending.md: research/extending.md
        research-toolkit/api-reference.md: research/api/index.md
        research-toolkit/api/types.md: research/api/types.md
        research-toolkit/api/benchmarks.md: research/api/benchmarks.md
        research-toolkit/api/agents.md: research/api/agents.md
        research-toolkit/api/pipelines.md: research/api/pipelines.md
        research-toolkit/api/preprocessing.md: research/api/preprocessing.md
        research-toolkit/api/metrics.md: research/api/metrics.md
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            preload_modules: [pydantic_ai.settings]
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            inherited_members: true
            filters:
              - "!^_"
              - "^__call__$"
              - "!^model_config$"
              - "!^validate_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs", "."]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/toc-selection.js
  - javascripts/copy-button.js
  - javascripts/demo-gallery.js
  - javascripts/arcs-page.js
