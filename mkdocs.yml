site_name: TabulaFlow
site_description: An interactive data agent, Python library, and text-to-query research toolkit
site_url: https://megagonlabs.github.io/tabulaflow/
repo_url: https://github.com/megagonlabs/tabulaflow
repo_name: megagonlabs/tabulaflow
copyright: Copyright &copy; Megagon Labs

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: custom
    accent: custom

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quick start: quick-start.md
  - Guides:
      - Connecting data: connecting-data.md
      - Common workflows: common-workflows.md
      - Configuration: configuration.md
  - Build:
      - Python library: python-library.md
      - Research toolkit: research-toolkit.md
  - Help:
      - Security and privacy: security-and-privacy.md
      - Troubleshooting: troubleshooting.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
