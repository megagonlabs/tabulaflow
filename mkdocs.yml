site_name: TabulaFlow
site_description: An interactive data agent, Python library, and text-to-query research toolkit
site_url: https://megagonlabs.github.io/tabulaflow/
repo_url: https://github.com/megagonlabs/tabulaflow
repo_name: megagonlabs/tabulaflow
copyright: "&copy; 2026 Megagon Labs"

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: custom
    accent: custom

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/megagon-labs/about/
      name: Megagon Labs on LinkedIn
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/megagonlabs
      name: Megagon Labs on X

nav:
  - Overview: index.md
  - Quick start: data-agent/quick-start.md
  - Examples:
      - Compare spending by merchant: data-agent/examples/compare-spending.md
      - Evaluate model performance: data-agent/examples/evaluate-model-performance.md
      - Extract data from receipts: data-agent/examples/extract-receipts.md
      - Combine multiple sources: data-agent/examples/combine-sources.md
      - Build a dataset from the web: data-agent/examples/build-web-dataset.md
      - Map geographic boundaries: data-agent/examples/map-boundaries.md
      - Explore relationships: data-agent/examples/explore-relationships.md
  - Connecting data: data-agent/connecting-data.md
  - Configuration: data-agent/configuration.md
  - TabulaFlow as a Python Library:
      - Quick start: python-library/quick-start.md
      - Data connectors: python-library/data-connectors.md
      - Chat sessions: python-library/chat-sessions.md
      - Structured outputs: python-library/structured-outputs.md
      - Custom agents: python-library/custom-agents.md
      - API reference:
          - Overview: python-library/api-reference.md
          - Core: python-library/api/core.md
          - Data: python-library/api/data.md
          - Output: python-library/api/output.md
          - Agents: python-library/api/agents.md
  - Research toolkit:
      - Quick start: research-toolkit/quick-start.md
      - Benchmarks: research-toolkit/benchmarks.md
      - Agents: research-toolkit/agents.md
      - Running experiments: research-toolkit/running-experiments.md
      - Evaluation and analysis: research-toolkit/evaluation.md
      - Extend the toolkit: research-toolkit/extending.md
      - API reference:
          - Overview: research-toolkit/api-reference.md
          - Tasks and runs: research-toolkit/api/types.md
          - Benchmarks: research-toolkit/api/benchmarks.md
          - Agents and tools: research-toolkit/api/agents.md
          - Pipelines: research-toolkit/api/pipelines.md
          - Preprocessing: research-toolkit/api/preprocessing.md
          - Metrics: research-toolkit/api/metrics.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            preload_modules: [pydantic_ai.settings]
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            inherited_members: true
            filters:
              - "!^_"
              - "^__call__$"
              - "!^model_config$"
              - "!^validate_"

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      toc_depth: 3
  - pymdownx.highlight
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs"]
      check_paths: true
      dedent_subsections: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/toc-selection.js
  - javascripts/copy-button.js
